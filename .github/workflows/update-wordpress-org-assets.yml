name: Update WordPress.org assets and readme

on:
  push:
    branches:
      - main
    paths:
      - readme.txt
      - .wordpress-org/**

permissions:
  contents: read

jobs:
  assets:
    name: Update readme and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pushes readme.txt and the icon/banner/screenshots under .wordpress-org/
      # to the WordPress.org plugin page without cutting a new release.
      - name: Update WordPress.org readme and assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: kjeks
