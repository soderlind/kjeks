name: On Release, Build release zip

on:
  release:
    types: [published]

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    env:
      PLUGIN_ZIP: kjeks.zip
      SLUG: kjeks
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build assets
        run: |
          npm install
          npm run build

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader

      # Stage under the slug applying the same .distignore exclusions the wp.org
      # deploy uses, so both artifacts contain exactly the same files.
      - name: Stage plugin honoring .distignore
        run: |
          mkdir -p "dist/${SLUG}"
          grep -vE '^[[:space:]]*(#|$)' .distignore > /tmp/distignore.txt
          rsync -a --exclude='.git' --exclude='dist' --exclude-from=/tmp/distignore.txt ./ "dist/${SLUG}/"

      - name: Create zip
        run: cd dist && zip -qr "../${PLUGIN_ZIP}" "${SLUG}"

      - name: Verify archive matches the wp.org distribution
        run: |
          echo "Entries: $(unzip -l "$PLUGIN_ZIP" | awk 'END{print $2}')"
          fail=0
          # Must NOT ship the self-updater.
          if unzip -l "$PLUGIN_ZIP" | grep -q "plugin-update-checker"; then
            echo "ERROR: self-updater present in the zip"; fail=1
          fi
          # Must ship the built entrypoint, autoloader, composer.json, readme.
          for f in "${SLUG}/build/network.js" "${SLUG}/vendor/autoload.php" "${SLUG}/composer.json" "${SLUG}/readme.txt"; do
            unzip -l "$PLUGIN_ZIP" | grep -q " ${f}$" || { echo "ERROR: missing ${f}"; fail=1; }
          done
          # Must NOT ship dev cruft.
          for f in "${SLUG}/tests/" "${SLUG}/e2e/" "${SLUG}/examples/" "${SLUG}/phpcs.xml.dist" "${SLUG}/assets/src/" "${SLUG}/.markdownlint.json"; do
            unzip -l "$PLUGIN_ZIP" | grep -q "${f}" && { echo "ERROR: should not ship ${f}"; fail=1; }
          done
          exit $fail

      - name: Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda #v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.PLUGIN_ZIP }}
          tag_name: ${{ github.event.release.tag_name }}
