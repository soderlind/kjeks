name: Kjeks discovery scan

on:
  schedule:
    # Weekly, Monday 03:00 UTC. Adjust to your needs.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scanner dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scan
        id: scan
        # Non-zero exit means a subsite changed; keep going so we can commit + import.
        continue-on-error: true
        env:
          KJEKS_USER: ${{ secrets.KJEKS_USER }}
          KJEKS_APP_PASSWORD: ${{ secrets.KJEKS_APP_PASSWORD }}
        # Fetch the site list from WordPress over REST.
        # Add `--overlay overlay.json` to merge repo-side paths/scenarios.
        run: >-
          node src/cli.js
          --config-url "${{ secrets.KJEKS_SITE_URL }}/wp-json/kjeks/v1/scan-config"
          --out ../scan

      - name: Upload full scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: kjeks-scan
          path: scan/

      - name: Import observations (unreviewed)
        if: ${{ env.KJEKS_APP_PASSWORD != '' }}
        env:
          KJEKS_USER: ${{ secrets.KJEKS_USER }}
          KJEKS_APP_PASSWORD: ${{ secrets.KJEKS_APP_PASSWORD }}
        run: node src/import.js --site "${{ secrets.KJEKS_SITE_URL }}" ../scan/*.json

      - name: Commit baseline changes
        working-directory: .
        run: |
          if [[ -n "$(git status --porcelain scan)" ]]; then
            git config user.name "kjeks-scanner"
            git config user.email "kjeks-scanner@users.noreply.github.com"
            git add scan
            git commit -m "chore(scan): update discovery baseline"
            git push
          else
            echo "No baseline changes."
          fi
